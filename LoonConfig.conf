[Script]

# 移除12306启动页广告
# 拦截广告请求并返回干净的数据
request if ${url} ~= /^https:\/\/ad\.12306\.cn\/ad\/ser\/getAdList/i then script("https://raw.githubusercontent.com/ddgksf2013/Scripts/master/12306.js") with tag="移除启动广告", timeout=60, requires_body=true
request if ${url} ~= /^https:\/\/mobile\.12306\.cn\/otsmobile\/app\/mgs\/mgw\.htm$/i then script("https://kelee.one/Resource/JavaScript/12306/12306_remove_ads.js") with tag="移除12306应用内广告"


