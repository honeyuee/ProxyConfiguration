[Remote Filter]
# 仅保留美国、台湾，其他全部归入「其他节点」
美国节点 = NameRegex, FilterKey = "^(?=.*((?i)🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(\b(US|USA|United States)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$"
台湾节点 = NameRegex, FilterKey = "^(?=.*((?i)🇹🇼|台湾|(\b(TW|TWN|Tai|Taiwan)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$"
其他节点 = NameRegex, FilterKey = "^(?=.*(.))(?!.*((?i)🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(\b(US|USA|United States)(\d+)?\b)|🇹🇼|台湾|(\b(TW|TWN|Tai|Taiwan)(\d+)?\b)|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|邀请|好友|失联|(\b(USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic)(\d+)?\b|(\d{4}-\d{2}-\d{2}|\dG)))).*$"

[Proxy Group]
# --------------------------------
# 地区自动策略（url-test 自动测速选最优）
美国自动策略 = url-test,美国节点,url = http://www.gstatic.com/generate_204,interval = 60,tolerance = 50,img-url = https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png
台湾自动策略 = url-test,台湾节点,url = http://www.gstatic.com/generate_204,interval = 60,tolerance = 50,img-url = https://raw.githubusercontent.com/Orz-3/mini/master/Color/TW.png
其他自动策略 = url-test,其他节点,url = http://www.gstatic.com/generate_204,interval = 60,tolerance = 50,img-url = https://raw.githubusercontent.com/Orz-3/mini/master/Color/Global.png

# --------------------------------
# 核心策略
# 优先策略：美国自动 → 台湾自动 → 其他自动（fallback 兜底）
优先策略 = fallback,美国自动策略,台湾自动策略,其他自动策略,url = http://www.gstatic.com/generate_204,interval = 60,max-timeout = 2000,img-url = https://github.com/shindgewongxj/WHATSINStash/raw/main/icon/fallback.png

# 加密货币交易所专用策略（强制台湾节点）
交易所策略 = select,台湾自动策略,img-url = https://raw.githubusercontent.com/Orz-3/mini/master/Color/TW.png



