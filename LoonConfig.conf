# LOON 配置
# 原配置：https://raw.githubusercontent.com/honeyuee/ProxyConfiguration/refs/heads/main/LoonConfig.conf
# 修复说明：
# 1. 本地 [Rule] 补全策略：国内服务/运营商→DIRECT，海外服务→美国节点，广告/追踪→REJECT
# 2. 移除 Loon 不支持的 DOMAIN-WILDCARD（改为 DOMAIN-KEYWORD）
# 3. FINAL 置于本地规则最后，指向「兜底后备策略」
# 4. [Remote Rule] 英文策略名改为对应中文策略组
# 5. url-test/fallback 补充 url= 测速地址；enable= 统一为 enabled=
# ============================================

