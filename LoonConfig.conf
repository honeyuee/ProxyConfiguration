request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=gm\+([^&]+).+/i as urlMatch then redirect(302, "https://www.google.com/search?&tbm=isch&q=${urlMatch.1}")
# gh   (GitHub)
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=gh\+([^&]+).+/i as urlMatch then redirect(302, "https://github.com/search?q=${urlMatch.1}")
# sof  (Stack Overflow)
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=sof\+([^&]+).+/i as urlMatch then redirect(302, "https://stackoverflow.com/search?q=${urlMatch.1}")
# se  (StackExchange)
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=se\+([^&]+).+/i as urlMatch then redirect(302, "https://stackexchange.com/search?q=${urlMatch.1}")
# wa  (WolframAlpha)
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=wa\+([^&]+).+/i as urlMatch then redirect(302, "https://www.wolframalpha.com/input/?i=${urlMatch.1}")
# wiki  (维基百科)
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=wiki(\+|%20)([^&]+).+/i as urlMatch then redirect(302, "http://wikipedia.org/wiki/${urlMatch.2}")
# wk  (维基中文)
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=wk(\+|%20)([^&]+).+/i as urlMatch then redirect(302, "https://zh.wikipedia.org/wiki/${urlMatch.2}")
# mg  (Magi)
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=mg(\+|%20)([^&]+).+/i as urlMatch then redirect(302, "https://magi.com/search?q=${urlMatch.2}")
# tf  (Google 搜索 TestFlight)
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=tf(\+|%20)([^&]+).+/i as urlMatch then redirect(302, "https://www.google.com/search?as_q=${urlMatch.2}&as_sitesearch=testflight.apple.com")
# > 翻译
# yd   (有道)
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=yd\+([^&]+).+/i as urlMatch then redirect(302, "http://dict.youdao.com/search?q=${urlMatch.1}")
# trc  (Google 译至中)
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=trc\+([^&]+).+/i as urlMatch then redirect(302, "https://translate.google.com/#view=home&op=translate&sl=auto&tl=zh-cn&text=${urlMatch.1}")
# tre  (Google 译至英)
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=tre\+([^&]+).+/i as urlMatch then redirect(302, "https://translate.google.com/#view=home&op=translate&sl=auto&tl=en&text=${urlMatch.1}")
# trj  (Google 译至日)
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=trj\+([^&]+).+/i as urlMatch then redirect(302, "https://translate.google.com/#view=home&op=translate&sl=auto&tl=ja&text=${urlMatch.1}")
# 社区
# db：豆瓣
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=db\+([^&]+).+/i as urlMatch then redirect(302, "https://m.douban.com/search/?query=${urlMatch.1}")
# zh: 知乎
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=zh\+([^&]+).+/i as urlMatch then redirect(302, "https://www.zhihu.com/search?type=content&q=${urlMatch.1}")
# wb: 微博
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=wb\+([^&]+).+/i as urlMatch then redirect(302, "https://s.weibo.com/weibo/${urlMatch.1}")
# wx: 微信
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=wx\+([^&]+).+/i as urlMatch then redirect(302, "https://weixin.sogou.com/weixinwap?query=${urlMatch.1}")
# rd  (Reddit)
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=rd\+([^&]+).+/i as urlMatch then redirect(302, "https://www.reddit.com/search?q=${urlMatch.1}")
# tw (Twitter)
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=tw\+([^&]+).+/i as urlMatch then redirect(302, "https://twitter.com/search?q=${urlMatch.1}")
# ssp: 少数派
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=ssp\+([^&]+).+/i as urlMatch then redirect(302, "https://sspai.com/search/post/${urlMatch.1}")
# csdn: CSDN
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=csdn\+([^&]+).+/i as urlMatch then redirect(302, "https://so.csdn.net/so/search/s.do?q=${urlMatch.1}&t=&u=")
# > 购物
# zdm: 什么值得买
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=zdm\+([^&]+).+/i as urlMatch then redirect(302, "https://search.m.smzdm.com/?v=b&s=${urlMatch.1}")
# amz: 亚马逊
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=amz\+([^&]+).+/i as urlMatch then redirect(302, "https://www.amazon.cn/gp/aw/s/?k=${urlMatch.1}")
# jd : 京东
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=jd\+([^&]+).+/i as urlMatch then redirect(302, "https://so.m.jd.com/ware/search.action?keyword=${urlMatch.1}")
# tb: 淘宝
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=tb\+([^&]+).+/i as urlMatch then redirect(302, "https://s.m.taobao.com/h5?q=${urlMatch.1}")
# tm: 天猫
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=tm\+([^&]+).+/i as urlMatch then redirect(302, "https://s.m.tmall.com/m/search.htm?q=${urlMatch.1}")
# 视频资源
# ac (Acfun)
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=ac\+([^&]+).+/i as urlMatch then redirect(302, "https://www.acfun.cn/search?keyword==${urlMatch.1}")
# bli (哔哩哔哩) 
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=bli\+([^&]+).+/i as urlMatch then redirect(302, "https://m.bilibili.com/search?keyword=${urlMatch.1}")
# ytb  (YouTube)
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=ytb\+([^&]+).+/i as urlMatch then redirect(302, "https://www.youtube.com/results?search_query=${urlMatch.1}")
# ph  (PornHub) 
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=ph\+([^&]+).+/i as urlMatch then redirect(302, "https://cn.pornhub.com/video/search?search=${urlMatch.1}")
# gd  (Google Drive)
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=gd\+([^&]+).+/i as urlMatch then redirect(302, "https://www.google.com/search?q=%22google+drive%22+${urlMatch.1}")
# tgd  (t.me/gdurl 搜索 Google Drive 资源)
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=tgd\+([^&]+).+/i as urlMatch then redirect(302, "https://t.me/s/gdurl?q=${urlMatch.1}")
# 默认搜索
# bi: 必应
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=bi\+([^&]+).+/i as urlMatch then redirect(302, "https://cn.bing.com/search?q=${urlMatch.1}")
# bd: 百度
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=bd\+([^&]+).+/i as urlMatch then redirect(302, "https://www.baidu.com/s?wd=${urlMatch.1}")
# ddg: DuckDuckGo 
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=ddg\+([^&]+).+/i as urlMatch then redirect(302, "https://duckduckgo.com/?ia=about&q=${urlMatch.1}")
# 无指令: 谷歌
request if ${url} ~= /^https:\/\/duckduckgo.com\/\?q=([^&]+).+/i as urlMatch then redirect(302, "https://www.google.com/search?q=${urlMatch.1}")

